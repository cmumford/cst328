name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check (library + examples)
        run: cargo check --all-targets --all-features --target riscv32imc-unknown-none-elf

      - name: Build examples
        run: |
          cargo build --example simple --target riscv32imc-unknown-none-elf --features use_sync
          cargo build --example simple_async --target riscv32imc-unknown-none-elf --features use_async

      - name: Build documentation
        run: cargo doc --no-deps --all-features