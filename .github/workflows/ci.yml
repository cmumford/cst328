name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (sync)
        run: cargo clippy --all-targets --features use_sync -- -D warnings

      - name: Clippy (async)
        run: cargo clippy --all-targets --features use_async -- -D warnings

      - name: Check (sync)
        run: cargo check --all-targets --features use_sync --target riscv32imc-unknown-none-elf

      - name: Check (async)
        run: cargo check --all-targets --features use_async --target riscv32imc-unknown-none-elf

      - name: Build examples
        run: |
          cargo build --example simple --features use_sync --target riscv32imc-unknown-none-elf
          cargo build --example simple_async --features use_async --target riscv32imc-unknown-none-elf

      - name: Docs
        run: cargo doc --no-deps --features use_async