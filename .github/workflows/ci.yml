name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + RISC-V target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (sync)
        run: cargo clippy --features esp32c6,use_sync -- -D clippy::pedantic

      - name: Clippy (async)
        run: cargo clippy --features esp32c6,use_async -- -D clippy::pedantic

      - name: Check (sync)
        run: cargo check --target riscv32imc-unknown-none-elf --features esp32c6,use_sync

      - name: Check (async)
        run: cargo check --target riscv32imc-unknown-none-elf --features esp32c6,use_async

      - name: Build examples
        run: |
          cargo build --example simple --features esp32c6,use_sync --target riscv32imc-unknown-none-elf
          cargo build --example simple_async --features esp32c6,use_async --target riscv32imc-unknown-none-elf

      - name: Docs
        run: cargo doc --no-deps --features esp32c6,use_async