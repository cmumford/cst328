[package]
name = "cst328"
version = "1.0.0"
edition = "2024"
authors = ["Chris Mumford <cmumford@cmumford.com>"]
description = "Pure Rust CST328 touch driver (blocking + async support)"
readme = "README.md"
keywords = ["touch", "driver", "hynitron"]
license = "MIT"

[dependencies]
bilge = "0.3.0"
cfg-if = "1.0.4"
embedded-hal = "1.0"
embedded-hal-async = { version = "1.0", optional = true }
maybe-async-cfg = "0.2.5"

[dev-dependencies]
embassy-executor = { version = "0.10.0" }
embassy-time = { version = "0.5.1", features = ["generic-queue-8"] }
esp-bootloader-esp-idf = "0.5.0"
esp-hal = { version = "1.1.0", features = [
    "exception-handler",
    "log-04",
    "unstable",
] }
esp-println = { version = "0.17.0", features = ["log-04"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "log-04"] }
log = "0.4"

[features]
use_async = ["embedded-hal-async"]
use_sync = []

esp32 = [
    "esp-bootloader-esp-idf/esp32",
    "esp-hal/esp32",
    "esp-println/esp32",
    "esp-rtos/esp32",
]

esp32c3 = [
    "esp-bootloader-esp-idf/esp32c3",
    "esp-hal/esp32c3",
    "esp-println/esp32c3",
    "esp-rtos/esp32c3",
]

esp32c6 = [
    "esp-bootloader-esp-idf/esp32c6",
    "esp-hal/esp32c6",
    "esp-println/esp32c6",
    "esp-rtos/esp32c6",
]

esp32h2 = [
    "esp-bootloader-esp-idf/esp32h2",
    "esp-hal/esp32h2",
    "esp-println/esp32h2",
    "esp-rtos/esp32h2",
]

esp32s2 = [
    "esp-bootloader-esp-idf/esp32s2",
    "esp-hal/esp32s2",
    "esp-println/esp32s2",
    "esp-rtos/esp32s2",
]

esp32s3 = [
    "esp-bootloader-esp-idf/esp32s3",
    "esp-hal/esp32s3",
    "esp-println/esp32s3",
    "esp-rtos/esp32s3",
]

[[example]]
name = "simple"
path = "examples/simple.rs"
required-features = ["use_sync"]

[[example]]
name = "simple_async"
path = "examples/simple_async.rs"
required-features = ["use_async"]
